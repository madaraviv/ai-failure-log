name: check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python check_failure_log.py FAILURE_LOG.md
      - run: for f in examples/*.md; do python check_failure_log.py "$f" --scrub-check; done
      - run: python -m unittest discover -s tests
